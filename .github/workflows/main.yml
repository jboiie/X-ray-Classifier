name: CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.9"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Syntax Check
      run: |
        # Checks app.py for syntax errors (won't run the app, just checks code)
        python -m py_compile app.py

    - name: Build Docker Image
      run: |
        # Builds the container to prove the Dockerfile works
        docker build . --file Dockerfile --tag xray-classifier:latest
